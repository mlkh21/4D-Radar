# ==============================================================================
# 4D Radar Diffusion & Consistency Models - Configuration File
# ==============================================================================

# --- Data Configuration ---
data:
  # formal v2 只训练/评价 0--80 m；80--120 m 由地图端保持 unknown。
  dataset_dir: "./Data/NTU4DRadLM_Pre_formal_v2_80m_86p8_v1"
  scene_names: ["garden"]
  calibration_dir: "./Data/config"
  require_real_ir: true
  require_real_calibration: true
  require_persisted_observed_mask: true
  # 逐字段计数参与 resize 聚合；模型输入接口仍保持四通道 Radar voxel。
  require_radar_statistics: true
  voxel_coordinate_frame: "lidar"
  checkpoint_protocol: "formal_chain_v2"
  # 由 v2 manifest、唯一 split、target/observed 和标定 hash 自动生成。
  temporal_split_artifact: "./Data/NTU4DRadLM_Pre_formal_v2_80m_86p8_v1/temporal_split_garden_train80_purge3s_v1.json"
  data_protocol_path: "./Data/NTU4DRadLM_Pre_formal_v2_80m_86p8_v1/formal_data_protocol_garden_train80_purge3s_v1.json"
  batch_size: 2
  num_workers: 4
  train_split: 0.8 # 仅 legacy 入口使用；formal v2 消费唯一 split artifact。
  alignment_size: 32
  # 正式协议没有已验证的传感器噪声模型，禁止物理通道抖动和共享强度缩放。
  use_augmentation: false
  # 显式冻结训练/推理共用网格，必须与 normalization artifact 一致。
  target_size: [32, 128, 128]
  source_pc_range: [0, -20, -6, 80, 20, 10]
  model_pc_range: [0, -20, -6, 80, 20, 10]
  radar_normalization_path: "./diffusion_consistency_radar/config/radar_normalization_garden_32x128x128_80m_train80_purge3s_86p8_v2.json"
  # 固定 artifact 文件身份；单次运行可用 EXPECTED_ARTIFACT_SHA256 临时覆盖。
  radar_normalization_sha256: "11f59d84cc186c39256c112154faf458ec9ead5fec9b08b997abd5058b68e97c"
  # 传感器 Doppler 显式物理量程（m/s），与 artifact 严格匹配。
  doppler_scale_mps: 86.8
  augmentation:
    # 保持视点几何形状固定，以实现前视雷达致密化
    enable_flip: false
    enable_rotate: false
    flip_prob: 0.0
    rotate_prob: 0.0
    noise_prob: 0.2
    noise_std: 0.02
    dropout_prob: 0.1
    point_dropout_rate: 0.05

# --- VAE Configuration ---
vae:
  # Config type: ultra_lightweight / lightweight / standard
  config_type: "ultra_lightweight"
  in_channels: 4
  out_channels: 4
  latent_dim: 4
  kl_weight: 1.0e-6
  # formal VAE 使用稀疏 BCE+Dice；legacy MSE 专用权重由模型 preset 保留，
  # 不在正式 YAML 中暴露为看似有效的训练旋钮。
  occupancy_loss_type: "bce_dice"
  occupancy_bce_weight: 1.0
  occupancy_dice_weight: 1.0
  occupancy_pos_weight_cap: 128.0
  continuous_recon_weight: 1.0
  # Training parameters
  # 正式默认值；0 帧表示使用对应 temporal partition 的全部帧。
  epochs: 20
  train_frames_per_epoch: 3210
  validation_frames_per_epoch: 774
  lr: 1.0e-4
  save_every: 10
  save_dir: "./Result/train_results/formal_v2_80m_86p8_v1/vae"

# --- LDM模型配置 ---
ldm:
  # Model architecture
  model_channels: 32
  channel_mult: [1, 2, 3]
  num_res_blocks: 1
  attention_resolutions: [] #禁用注意力以节省内存
  # 扩散参数 (Karras)
  sigma_data: 0.5
  sigma_max: 80.0
  sigma_min: 0.002
  rho: 7.0
  # 局部去噪只保留为训练诊断，不参与 checkpoint 或 threshold 选优。
  validation_seed: 42
  validation_sigma: 0.5
  validation_occupancy_threshold: 0.5
  validation_threshold_candidates: [0.05, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90, 0.95]
  # 每轮在 validation suffix 的固定前缀上执行部署一致的 40-step Heun 完整采样。
  deployment_validation_frames_per_scene: 16
  deployment_validation_seed: 42
  deployment_validation_steps: 40
  deployment_validation_sampler: "heun"
  deployment_validation_occupancy_threshold: 0.5
  deployment_validation_threshold_candidates: [0.05, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90, 0.95]
  # 未获得权威最低召回率时保持 null/空字符串；artifact 将明确标记为未通过安全召回资格。
  deployment_validation_min_occupied_recall: null
  deployment_validation_recall_constraint_authority: ""
  decoded_loss_weight: 0.05
  decoded_false_positive_weight: 0.10
  decoded_mass_weight: 0.05
  decoded_height_distribution_weight: 0.02
  decoded_vertical_continuity_weight: 0.02
  uncertainty_loss_weight: 0.05
  # 训练参数
  epochs: 20
  train_frames_per_epoch: 3210
  validation_frames_per_epoch: 774
  lr: 1.0e-4
  save_every: 10 # 每 N 个时期保存检查点
  save_dir: "./Result/train_results/formal_v2_80m_86p8_v1/ldm"

# --- LDM 初始化、边界锚定的 EMA consistency 配置 ---
cd:
  initialization_model_path: "" # LDM 只用于初始化 CD/EMA
  teacher_model_path: "" # legacy 配置别名；新配置保持为空
  training_semantics: "ldm_initialized_boundary_anchored_ema_consistency_v2"
  num_scales: 40
  ema_rate: 0.999
  sigma_min: 0.002
  sigma_max: 80.0
  rho: 7.0
  consistency_loss_weight: 1.0
  # 仅在 persisted observed latent 域约束一步输出回到真实 target，排除常数解。
  reconstruction_anchor_weight: 0.1
  # 严格检测完全不随条件变化的输出；若需数值容差必须显式改配置并进入收据。
  collapse_guard_epsilon: 0.0
  # Training parameters
  epochs: 20
  train_frames_per_epoch: 3210
  # 局部去噪只保留为 online/EMA 诊断，不参与部署权重选优。
  validation_frames_per_epoch: 774
  validation_seed: 42
  validation_sigma: 0.5
  validation_occupancy_threshold: 0.5
  validation_threshold_candidates: [0.05, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90, 0.95]
  # 固定子集从 sigma_max 纯噪声执行一步部署采样，决定 online/EMA、checkpoint 和 threshold。
  deployment_validation_frames_per_scene: 16
  deployment_validation_seed: 42
  deployment_validation_steps: 1
  deployment_validation_sampler: "one_step"
  deployment_validation_occupancy_threshold: 0.5
  deployment_validation_threshold_candidates: [0.05, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90, 0.95]
  # 未获得权威最低召回率时保持 null/空字符串；artifact 将明确标记为未通过安全召回资格。
  deployment_validation_min_occupied_recall: null
  deployment_validation_recall_constraint_authority: ""
  lr: 5.0e-5
  save_every: 10 # Save checkpoint every N epochs
  save_dir: "./Result/train_results/formal_v2_80m_86p8_v1/cd"

# --- 优化配置 ---
optimization:
  use_amp: false # 混合精度训练（由于 VAE 中类型不匹配而禁用）
  gradient_accumulation_steps: 8
  use_checkpoint: true # 梯度检查点
  use_fp16: false # FP16
  max_grad_norm: 1.0

# --- 硬件配置 ---
hardware:
  device: "cuda"
  # 正式服务器默认使用2卡；单次运行可用 CUDA_DEVICES 覆盖，例如 0,1,2,3。
  # 实际 num_gpus/world_size 由 launcher 对该列表严格解析后写入运行时配置。
  cuda_devices: "0,1"

# --- 日志记录配置 ---
logging:
  log_interval: 100 # 每 N 个训练步骤记录一次日志
  save_samples: true # 是否启用样本保存
  sample_interval: 1000 # 保存间隔
  tensorboard: true # 是否使用 TensorBoard
  wandb: false # 是否使用 Weights & Biases

# --- 推理配置 ---
inference:
  # 批量推理脚本的每个场景文件上限（0 表示所有文件）
  max_infer_files: 100
  # 如果阈值占用为空，则保留前 k 个占用体素作为后备（0 禁用）
  empty_fallback_topk: 0
  # TODO: 新增速度分档参数(35/50/70mps)用于动态窗口与衰减策略配置。
  # TODO: 新增在线融合参数（IR质量门控、DEM先验置信图、风险判定反应时）。
