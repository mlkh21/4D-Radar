# ==============================================================================
# 4D Radar Diffusion & Consistency Models - Configuration File
# ==============================================================================

# --- Data Configuration ---
data:
  # formal v2 只训练/评价 0--80 m；80--120 m 由地图端保持 unknown。
  dataset_dir: "./Data/NTU4DRadLM_Pre_formal_v2_80m_86p8_v1"
  scene_names: ["garden"]
  calibration_dir: "./Data/config"
  require_real_ir: true
  require_real_calibration: true
  require_persisted_observed_mask: true
  # 统计只作为审计 metadata；当前模型输入仍为原四通道 Radar voxel。
  require_radar_statistics: true
  voxel_coordinate_frame: "lidar"
  checkpoint_protocol: "formal_chain_v2"
  # 由 v2 manifest、唯一 split、target/observed 和标定 hash 自动生成。
  temporal_split_artifact: "./Data/NTU4DRadLM_Pre_formal_v2_80m_86p8_v1/temporal_split_garden_train80_purge3s_v1.json"
  data_protocol_path: "./Data/NTU4DRadLM_Pre_formal_v2_80m_86p8_v1/formal_data_protocol_garden_train80_purge3s_v1.json"
  batch_size: 2
  num_workers: 4
  train_split: 0.8  # 仅 legacy 入口使用；formal v2 消费唯一 split artifact。
  alignment_size: 32
  use_augmentation: true
  # 显式冻结训练/推理共用网格，必须与 normalization artifact 一致。
  target_size: [32, 128, 128]
  source_pc_range: [0, -20, -6, 80, 20, 10]
  model_pc_range: [0, -20, -6, 80, 20, 10]
  radar_normalization_path: "./diffusion_consistency_radar/config/radar_normalization_garden_32x128x128_80m_train80_purge3s_86p8_v2.json"
  # 传感器 Doppler 显式物理量程（m/s），与 artifact 严格匹配。
  doppler_scale_mps: 86.8
  augmentation:
    # Keep viewpoint geometry fixed for forward-looking radar densification.
    enable_flip: false
    enable_rotate: false
    flip_prob: 0.0
    rotate_prob: 0.0
    noise_prob: 0.2
    noise_std: 0.02
    dropout_prob: 0.1
    point_dropout_rate: 0.05

# --- VAE Configuration ---
vae:
  # Config type: ultra_lightweight / lightweight / standard
  config_type: "ultra_lightweight"
  in_channels: 4
  out_channels: 4
  latent_dim: 4
  kl_weight: 1.0e-6
  # Sparse occupancy needs stronger positive-voxel supervision than plain MSE.
  occupied_weight: 8.0
  empty_weight: 1.0
  channel_weights: [4.0, 0.2, 0.5, 0.2]
  false_positive_weight: 4.0
  occupancy_mass_weight: 1.0
  # Training parameters
  epochs: 100
  lr: 1.0e-4
  save_every: 10
  save_dir: "./Result/train_results/formal_v2_80m_86p8_v1/vae"

# --- Latent Diffusion Model Configuration ---
ldm:
  # Model architecture
  model_channels: 32
  channel_mult: [1, 2, 3]
  num_res_blocks: 1
  attention_resolutions: [] # Disable attention to save memory
  # Diffusion parameters (Karras)
  sigma_data: 0.5
  sigma_max: 80.0
  sigma_min: 0.002
  rho: 7.0
  # 每轮独立验证使用固定单步去噪代理；最终模型仍须通过离线固定帧生成门禁。
  validation_seed: 42
  validation_sigma: 0.5
  validation_occupancy_threshold: 0.5
  decoded_loss_weight: 0.05
  decoded_false_positive_weight: 0.10
  decoded_mass_weight: 0.05
  decoded_height_distribution_weight: 0.02
  decoded_vertical_continuity_weight: 0.02
  uncertainty_loss_weight: 0.05
  # Training parameters
  epochs: 200 # Number of training epochs
  lr: 1.0e-4
  save_every: 10 # Save checkpoint every N epochs
  save_dir: "./Result/train_results/formal_v2_80m_86p8_v1/ldm"

# --- Consistency Distillation Configuration ---
cd:
  # 兼容字段名：该 LDM checkpoint 只初始化 CD/EMA，不作为持续冻结教师。
  teacher_model_path: "" # LDM initialization checkpoint path
  # EMA consistency training parameters
  training_mode: "consistency_distillation"
  target_ema_mode: "fixed"
  start_ema: 0.95
  scale_mode: "fixed"
  start_scales: 40
  end_scales: 40
  epochs: 200 # Number of training epochs (100 epochs * 2007 batches ≈ 200k steps)
  distill_steps_per_iter: 50000
  loss_norm: "l2" # l1 / l2 / lpips
  # Training parameters
  lr: 5.0e-5
  save_every: 10 # Save checkpoint every N epochs
  save_dir: "./Result/train_results/formal_v2_80m_86p8_v1/cd"

# --- Optimization Configuration ---
optimization:
  use_amp: false # Mixed precision training (disabled due to type mismatch in VAE)
  gradient_accumulation_steps: 8
  use_checkpoint: true # Gradient checkpointing
  use_fp16: false # FP16 model weights
  max_grad_norm: 1.0

# --- Hardware Configuration ---
hardware:
  device: "cuda"
  num_gpus: 2

# --- Logging Configuration ---
logging:
  log_interval: 100
  save_samples: true
  sample_interval: 1000
  tensorboard: true
  wandb: false

# --- Inference Configuration ---
inference:
  # Per-scene file cap for batch inference scripts (0 means all files)
  max_infer_files: 100
  # If thresholded occupancy is empty, keep top-k occupancy voxels as fallback (0 disables)
  empty_fallback_topk: 0
  # TODO: 新增速度分档参数(35/50/70mps)用于动态窗口与衰减策略配置。
  # TODO: 新增在线融合参数（IR质量门控、DEM先验置信图、风险判定反应时）。
